<section class="modulex-sdv{{sdvsinif}}" {{sdvetiket}}>
  <div class="modulex-sdv-ic">
    <header class="modulex-sdv-bas">
      {{sdvust}}
      {{sdvbaslik}}
      {{sdvmetin}}
    </header>
    <div class="modulex-sdv-sira">{{sdvsayilar}}</div>
  </div>
</section>

<style>
  /* sayac-dev — dev tipografik sayaçlar (15 Kas 2026, G4 · D17). stats-2 ikonlu sayaç şeridi, stats-1 kart bandıdır; bu modülde sayı
     tipografinin kendisi: çok büyük, ince, tabular rakamlar; aralarında dikey çizgi; etiket sayının altında küçük harfli.
     stil: cizgi (açık zemin, üst çizgi) · koyu (koyu zemin, vurgu rengi rakam). Sunucu son değeri basar, istemci sayar. */
  .modulex-sdv {
    box-sizing: border-box;
    width: 100%;
    padding: clamp(56px, 8vw, 104px) 20px;
    background: --bg--;
    color: --text--;
    font-size: 1rem;
    font-family: var(--mx-font-sans, inherit);
  }
  .modulex-sdv--koyu { background: --koyuBg--; color: --koyuText--; }
  .modulex-sdv *,
  .modulex-sdv *::before,
  .modulex-sdv *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sdv :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  .modulex-sdv-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sdv-bas { max-width: 720px; margin-block-end: clamp(32px, 5vw, 64px); }
  .modulex-sdv--bassiz .modulex-sdv-bas { display: none; }
  .modulex-sdv-ust { margin: 0 0 12px; color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sdv--koyu .modulex-sdv-ust { color: --accent--; }
  .modulex-sdv-baslik { margin: 0; font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.03em; line-height: 1.1; }
  .modulex-sdv-metin { margin: 16px 0 0; color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sdv--koyu .modulex-sdv-metin { color: color-mix(in srgb, --koyuText-- 72%, transparent); }

  .modulex-sdv-sira { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .modulex-sdv--n1 .modulex-sdv-sira { grid-template-columns: minmax(0, 1fr); }
  .modulex-sdv--n2 .modulex-sdv-sira { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modulex-sdv--n3 .modulex-sdv-sira { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .modulex-sdv-oge {
    padding-block: 28px 8px;
    padding-inline: clamp(16px, 2.4vw, 36px);
    border-block-start: 1px solid --cizgi--;
    border-inline-start: 1px solid --cizgi--;
    animation: modulex-sdv-gel 0.7s calc(var(--sdv-sira, 0) * 0.1s) cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .modulex-sdv-oge:nth-child(4n + 1) { border-inline-start-color: transparent; padding-inline-start: 0; }
  .modulex-sdv--koyu .modulex-sdv-oge { border-color: color-mix(in srgb, --koyuText-- 18%, transparent); }
  .modulex-sdv--koyu .modulex-sdv-oge:nth-child(4n + 1) { border-inline-start-color: transparent; }
  .modulex-sdv-sayi {
    display: flex;
    align-items: baseline;
    margin: 0;
    font-family: var(--mx-font-heading, inherit);
    font-size: clamp(3rem, 7vw, 6.2rem);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.05em;
    line-height: 1;
    white-space: nowrap;
    /* «4.9/5», «+1200», «%98»: rakam ifadesi her dilde soldan sağa okunur; RTL'de satır başına (sağa) yaslanır */
    direction: ltr;
    unicode-bidi: isolate;
  }
  [dir="rtl"] .modulex-sdv-sayi { justify-content: flex-end; }
  .modulex-sdv--koyu .modulex-sdv-sayi { color: --accent--; }
  .modulex-sdv-onek,
  .modulex-sdv-sonek { font-size: 0.45em; font-weight: 500; letter-spacing: 0; }
  .modulex-sdv-onek:empty,
  .modulex-sdv-sonek:empty { display: none; }
  .modulex-sdv-sonek { margin-inline-start: 0.12em; color: --accent--; }
  .modulex-sdv-onek { margin-inline-end: 0.08em; }
  .modulex-sdv-etiket { margin: 18px 0 0; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-sdv-aciklama { margin: 8px 0 0; color: --muted--; font-size: 0.95rem; line-height: 1.6; }
  .modulex-sdv--koyu .modulex-sdv-aciklama { color: color-mix(in srgb, --koyuText-- 70%, transparent); }
  @keyframes modulex-sdv-gel { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sdv-baslik { letter-spacing: 0; line-height: 1.35; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sdv-etiket,
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sdv-ust { letter-spacing: 0; }

  @media (max-width: 1024px) {
    .modulex-sdv .modulex-sdv-sira { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modulex-sdv--n1 .modulex-sdv-sira { grid-template-columns: minmax(0, 1fr); }
    .modulex-sdv-oge:nth-child(4n + 1) { padding-inline-start: clamp(16px, 2.4vw, 36px); border-inline-start-color: --cizgi--; }
    .modulex-sdv-oge:nth-child(2n + 1) { border-inline-start-color: transparent; padding-inline-start: 0; }
    .modulex-sdv--koyu .modulex-sdv-oge:nth-child(4n + 1) { border-inline-start-color: color-mix(in srgb, --koyuText-- 18%, transparent); }
    .modulex-sdv--koyu .modulex-sdv-oge:nth-child(2n + 1) { border-inline-start-color: transparent; }
  }
  @media (max-width: 768px) {
    .modulex-sdv .modulex-sdv-sira { grid-template-columns: minmax(0, 1fr); }
    .modulex-sdv .modulex-sdv-oge { padding-inline: 0; border-inline-start-color: transparent; }
    .modulex-sdv-sayi { font-size: clamp(3rem, 16vw, 4.6rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sdv-oge { animation: none !important; transition: none !important; }
  }
  .modulex-sdv-deger { transition: opacity 0.2s ease; cursor: default; }
  .modulex-sdv a { cursor: pointer; }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-sdv");
    if (!kok || kok.dataset.sdvHazir) return;
    kok.dataset.sdvHazir = "1";
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
    const dil = document.documentElement.lang || undefined;
    const degerler = [...kok.querySelectorAll(".modulex-sdv-deger")];
    const bicim = (d, o) => { try { return new Intl.NumberFormat(dil, { minimumFractionDigits: o, maximumFractionDigits: o }).format(d); } catch (e) { return d.toFixed(o); } };
    /* son değer sunucudan gelir; görünmeden önce 0'a çekilir (ekran okuyucu son değeri okur: aria-label) */
    degerler.forEach((el) => {
      el.setAttribute("aria-label", el.textContent);
      el.textContent = bicim(0, Number(el.dataset.ondalik) || 0);
    });
    const say = (el) => {
      const hedef = Number(el.dataset.hedef) || 0;
      const o = Number(el.dataset.ondalik) || 0;
      const sure = 1600;
      const bas = performance.now();
      const adim = (t) => {
        const p = Math.min(1, (t - bas) / sure);
        const e = 1 - Math.pow(1 - p, 3);
        if (p < 1) { el.textContent = bicim(hedef * e, o); requestAnimationFrame(adim); }
        else el.textContent = el.getAttribute("aria-label"); /* son kare: sunucunun biçimi (rakam sistemi dahil) */
      };
      requestAnimationFrame(adim);
    };
    const gozcu = new IntersectionObserver((g) => {
      g.forEach((x) => { if (x.isIntersecting) { say(x.target); gozcu.unobserve(x.target); } });
    }, { threshold: 0.4 });
    degerler.forEach((el) => gozcu.observe(el));
  })();
</script>
