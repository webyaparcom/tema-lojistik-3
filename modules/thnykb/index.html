<script>
  (() => {
    const P = "modulex-referans-cevir-kart";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cevir = (s, P) => {
        s.querySelectorAll("[data-cevir]").forEach((k) => {
          const tog = () => { const a = k.classList.toggle(P + "--acik"); k.setAttribute("aria-expanded", String(a)); };
          k.addEventListener("click", (e) => { if (!e.target.closest("a")) tog(); });
          k.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cevir(s, P, az);
    });
  })();
</script>
